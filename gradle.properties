org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.5.2 fue probado hasta compileSdk 34; con 35 solo avisa. Se silencia el aviso.
android.suppressUnsupportedCompileSdk=35

# Firma del APK release (OPCIONAL). No escribir aquí claves reales ni subirlas al repositorio:
# defínelas en ~/.gradle/gradle.properties, en un archivo keystore.properties (ver keystore.properties.example)
# o como variables de entorno con estos mismos nombres.
#   MPAZPRO_STORE_FILE=C:/ruta/a/mi-llave.jks
#   MPAZPRO_STORE_PASSWORD=...
#   MPAZPRO_KEY_ALIAS=...
#   MPAZPRO_KEY_PASSWORD=...

# --- Experiencia 3 ---
# Dirección inicial del servidor (API del backend). En el emulador 10.0.2.2 es el PC anfitrión.
# Se puede cambiar sin recompilar desde la pantalla "Servidor" de la app (login). Debe terminar en "/".
API_BASE_URL=http://10.0.2.2:3000/

# Solo define el valor INICIAL del interruptor "Modo local (sin servidor)" del diálogo Servidor:
# false = la app arranca en modo local (solo Room, sin servidor).
# true  = la app arranca en modo servidor: depende de lo que completes en los TODO(E3-n). Cámbialo cuando
#         tengas listas las partes 2 y 3 de la guía (o prueba con ./gradlew assembleDebug -PUSAR_API=true).
# Una vez elegido un modo en la app, manda lo guardado en el dispositivo.
USAR_API=false
